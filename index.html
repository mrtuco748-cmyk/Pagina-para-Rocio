<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Georgia', serif;
    background: #1a1a18;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem 1rem;
    color: #f0ede8;
  }

  h1 {
    font-size: 1.1rem;
    font-weight: 400;
    letter-spacing: 0.08em;
    color: #666;
    text-transform: uppercase;
    margin-bottom: 2rem;
  }

  .stage {
    width: 100%;
    max-width: 360px;
    aspect-ratio: 9/16;
    max-height: 640px;
    background: #2a2a28;
    border-radius: 20px;
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1.5px solid #333;
  }

  .stage video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
    border-radius: 20px;
  }

  .stage video.active {
    display: block;
  }

  .placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    color: #555;
  }

  .placeholder-circle {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: #2a2a28;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.2rem;
  }

  .placeholder p {
    font-size: 0.9rem;
    letter-spacing: 0.04em;
  }

  .action-label {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.88);
    border-radius: 20px;
    padding: 6px 16px;
    font-size: 0.8rem;
    color: #555;
    letter-spacing: 0.04em;
    white-space: nowrap;
    display: none;
    border: 0.5px solid #ddd;
  }

  .action-label.show { display: block; }

  .chat-box {
    width: 100%;
    max-width: 360px;
    margin-top: 1.5rem;
    background: #222220;
    border-radius: 20px;
    border: 1px solid #333;
    overflow: hidden;
  }

  .chat-header {
    padding: 14px 18px 10px;
    border-bottom: 0.5px solid #333;
  }

  .chat-header p {
    font-size: 0.85rem;
    color: #666;
    line-height: 1.5;
    font-style: italic;
  }

  .chat-messages {
    padding: 12px 16px;
    min-height: 60px;
    max-height: 120px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .msg {
    font-size: 0.9rem;
    padding: 8px 12px;
    border-radius: 14px;
    max-width: 80%;
    line-height: 1.4;
  }

  .msg.user {
    background: #f0ede8;
    color: #1a1a1a;
    align-self: flex-end;
    border-radius: 14px 14px 4px 14px;
  }

  .msg.facu {
    background: #2a2a28;
    color: #ccc;
    align-self: flex-start;
    border-radius: 14px 14px 14px 4px;
  }

  .chat-input-row {
    display: flex;
    gap: 8px;
    padding: 10px 14px 14px;
    border-top: 0.5px solid #333;
  }

  .chat-input-row input {
    flex: 1;
    border: 1px solid #444;
    border-radius: 30px;
    padding: 10px 16px;
    font-size: 0.9rem;
    outline: none;
    background: #2a2a28;
    color: #f0ede8;
    font-family: inherit;
  }

  .chat-input-row input::placeholder { color: #555; }
  .chat-input-row input:focus { border-color: #666; }

  .chat-input-row button {
    background: #f0ede8;
    color: #1a1a1a;
    border: none;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    cursor: pointer;
    font-size: 1.1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.15s;
    flex-shrink: 0;
  }

  .chat-input-row button:hover { opacity: 0.8; }

  .suggestions {
    display: flex;
    gap: 6px;
    padding: 10px 14px;
    flex-wrap: wrap;
  }

  .sug {
    font-size: 0.78rem;
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid #444;
    background: #2a2a28;
    color: #888;
    cursor: pointer;
    transition: all 0.15s;
  }

  .sug:hover { background: #f0ede8; color: #1a1a1a; border-color: #f0ede8; }
</style>
</head>
<body>

<h1>Facu a tu servicio</h1>

<div class="stage" id="stage">
  <div class="placeholder" id="placeholder">
    <div class="placeholder-circle">🎭</div>
    <p>Facu está esperando</p>
  </div>

  <video id="vid-idle" loop muted playsinline>
    <source src="TU_VIDEO_IDLE.mp4" type="video/mp4">
  </video>
  <video id="vid-cortina" playsinline>
    <source src="cortina.mp4" type="video/mp4">
  </video>
  <video id="vid-bailar" playsinline>
    <source src="TU_VIDEO_BAILAR.mp4" type="video/mp4">
  </video>
  <video id="vid-cantar" playsinline>
    <source src="TU_VIDEO_CANTAR.mp4" type="video/mp4">
  </video>
  <video id="vid-reverencia" playsinline>
    <source src="TU_VIDEO_REVERENCIA.mp4" type="video/mp4">
  </video>
  <video id="vid-beso" playsinline>
    <source src="TU_VIDEO_BESO.mp4" type="video/mp4">
  </video>

  <div class="action-label" id="action-label"></div>
</div>

<div class="chat-box">
  <div class="chat-header">
    <p>dile a Facu que haga algo 👀</p>
  </div>

  <div class="suggestions">
    <span class="sug" onclick="sendReq('bailá')">bailá 💃</span>
    <span class="sug" onclick="sendReq('cantá')">cantá 🎤</span>
    <span class="sug" onclick="sendReq('hacé una reverencia')">reverencia 🫡</span>
    <span class="sug" onclick="sendReq('tirá un beso')">tirá un beso 😘</span>
  </div>

  <div class="chat-messages" id="messages"></div>

  <div class="chat-input-row">
    <input id="chat-input" type="text" placeholder="Ej: bailá, cantá, tirá un beso..." />
    <button onclick="handleSend()">↑</button>
  </div>
</div>

<script>
const actions = [
  {
    id: 'bailar',
    keywords: ['bail','dance','pista','mov','ritmo','cumbia','musica','música'],
    label: '🕺 bailando...',
    reply: '¡A mover el esqueleto!'
  },
  {
    id: 'cantar',
    keywords: ['cant','sing','song','cancion','canción','voz','tema','serenata'],
    label: '🎤 cantando...',
    reply: '¡Do re mi fa sol la si!'
  },
  {
    id: 'reverencia',
    keywords: ['reverencia','inclina','bow','honor','respect','salud'],
    label: '🫡 haciendo una reverencia...',
    reply: '¡A sus órdenes, mi señora!'
  },
  {
    id: 'beso',
    keywords: ['beso','kiss','mwah','amor','corazon','corazón','love','pico'],
    label: '😘 tirando un beso...',
    reply: '¡Muak! Con todo mi amor 💕'
  }
];

const unknownReplies = [
  'Mmmm eso no lo sé hacer 😅 ¿probás con bailar o cantar?',
  '¡Che, eso está fuera de mi repertorio! Intentá con beso o reverencia 😅',
  'No entendí bien... ¿me lo pedís de otra forma? 🤔'
];

let unknownIdx = 0;
let busy = false;

function findAction(text) {
  const t = text.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  return actions.find(a => a.keywords.some(k => t.includes(k)));
}

function addMsg(text, who) {
  const msgs = document.getElementById('messages');
  const wrapper = document.createElement('div');
  wrapper.style.cssText = 'display:flex; align-items:flex-end; gap:8px; ' + (who === 'user' ? 'justify-content:flex-end;' : 'justify-content:flex-start;');

  if (who === 'facu') {
    const foto = document.createElement('img');
    foto.src = 'FOTO_FACU.jpg';
    foto.style.cssText = 'width:32px; height:32px; border-radius:50%; object-fit:cover; flex-shrink:0;';
    wrapper.appendChild(foto);
  }

  const m = document.createElement('div');
  m.className = 'msg ' + who;
  m.textContent = text;
  wrapper.appendChild(m);
  msgs.appendChild(wrapper);
  msgs.scrollTop = msgs.scrollHeight;
}

function showOnly(id) {
  document.querySelectorAll('.stage video').forEach(v => {
    v.classList.remove('active');
    v.pause();
  });
  document.getElementById('placeholder').style.display = 'none';
  const vid = document.getElementById('vid-' + id);
  vid.classList.add('active');
  vid.currentTime = 0;
  return vid;
}

function setLabel(text) {
  const lbl = document.getElementById('action-label');
  lbl.textContent = text;
  if (text) lbl.classList.add('show');
  else lbl.classList.remove('show');
}

// Reproduce un video y devuelve una promesa que se resuelve cuando termina
function playOnce(id, label) {
  return new Promise(resolve => {
    const vid = showOnly(id);
    setLabel(label);
    vid.play().catch(() => {});
    vid.onended = () => {
      vid.onended = null;
      resolve();
    };
  });
}

// Secuencia completa: cortina -> accion -> cortina -> idle
async function playSequence(action) {
  busy = true;

  // 1. cortina de entrada
  await playOnce('cortina', '');

  // 2. video de la accion
  await playOnce(action.id, action.label);

  // 3. cortina de salida
  await playOnce('cortina', '');

  // 4. volver al idle
  const idle = showOnly('idle');
  setLabel('');
  idle.loop = true;
  idle.play().catch(() => {});

  busy = false;
}

function sendReq(text) {
  document.getElementById('chat-input').value = text;
  handleSend();
}

function handleSend() {
  if (busy) return;
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  addMsg(text, 'user');

  setTimeout(() => {
    const action = findAction(text);
    if (action) {
      addMsg(action.reply, 'facu');
      playSequence(action);
    } else {
      addMsg(unknownReplies[unknownIdx % unknownReplies.length], 'facu');
      unknownIdx++;
    }
  }, 400);
}

document.getElementById('chat-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') handleSend();
});

// Arrancar con el idle
const idle = showOnly('idle');
idle.loop = true;
idle.play().catch(() => {});
</script>

</body>
</html>
